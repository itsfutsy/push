[package]
name = "push"
version = "1.0.0"
description = "Private screenshot and file sharing"
edition = "2024"
rust-version = "1.90"

[lib]
name = "push_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
tauri = { version = "2.12.4", features = ["tray-icon"] }
tauri-plugin-single-instance = "2.5.4"
tauri-plugin-global-shortcut = "2.4.1"
tauri-plugin-clipboard-manager = "2.5.0"
tauri-plugin-opener = "2.7.2"
tauri-plugin-dialog = "2.8.3"
tauri-plugin-autostart = "2.7.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "time", "sync", "process", "io-util", "macros"] }
futures-util = "0.3"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream", "json"] }
keyring = "4.2"
rand = "0.10.3"
base64 = "0.23"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.13", features = ["screenshot"] }
url = "2"
notify-rust = "4.18"
zbus = "5"

[profile.release]
lto = true
codegen-units = 1
strip = true
