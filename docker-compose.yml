# The Push server, plus Caddy, which sets up HTTPS for your domain automatically.
#
# Put your settings in a .env file next to this one:
#   PUSH_DOMAIN=share.example.com      your domain, with its DNS pointing at this server
#   PUSH_TOKEN=...                     your upload password: openssl rand -hex 32
#   PUSH_ROOT_REDIRECT=https://...     optional: where https://PUSH_DOMAIN/ sends visitors
# Then run: docker compose up -d
#
# Already use Dokploy, Coolify, Traefik or nginx? Run only the image instead (see the README).

services:
  push:
    image: ghcr.io/itsfutsy/push:latest
    restart: unless-stopped
    environment:
      PUSH_TOKEN: ${PUSH_TOKEN:?set PUSH_TOKEN in .env (openssl rand -hex 32)}
      PUSH_PUBLIC_URL: https://${PUSH_DOMAIN:?set PUSH_DOMAIN in .env}
      PUSH_ROOT_REDIRECT: ${PUSH_ROOT_REDIRECT:-}
    volumes:
      - push-data:/data

  caddy:
    image: caddy:2
    restart: unless-stopped
    command: caddy reverse-proxy --from ${PUSH_DOMAIN} --to push:3000
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy-data:/data
    depends_on:
      - push

volumes:
  push-data:
  caddy-data:
