name: windows

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    name: Installer (x86_64)
    runs-on: windows-latest
    permissions:
      contents: write # attach the installer to the release
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # The npm package ships a prebuilt tauri-cli, much faster than cargo install.
      - name: Build
        run: npx --yes @tauri-apps/cli@~2.12.3 build --bundles nsis

      - uses: actions/upload-artifact@v7
        with:
          name: push-windows-x86_64
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Attach to the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: src-tauri/target/release/bundle/nsis/*.exe
          fail_on_unmatched_files: true
