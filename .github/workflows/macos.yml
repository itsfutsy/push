name: macos

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    name: dmg (Apple silicon)
    runs-on: macos-26 # Xcode 26 compiles the Icon Composer icon (icons/Push.icon)
    permissions:
      contents: write # attach the dmg to the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri

      - name: Install tauri-cli
        run: cargo install tauri-cli --version "^2.12" --locked

      # Puts the Developer ID certificate in a throwaway keychain, and the App Store Connect API key on disk.
      - name: Set up signing
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(openssl rand -hex 16)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          base64 --decode <<<"$APPLE_CERTIFICATE" > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain"
          rm "$RUNNER_TEMP/cert.p12"
          printf '%s\n' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/api-key.p8"
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/api-key.p8" >> "$GITHUB_ENV"

      # Signs with the Developer ID (failing if it's missing), then Tauri notarizes and staples the app.
      - name: Build
        env:
          PUSH_SIGN_IDENTITY: "Developer ID Application: Abram Industries Pty ltd (4TZBGP972A)"
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: scripts/build-macos.sh

      - name: Check notarization
        run: |
          xcrun stapler validate src-tauri/target/release/bundle/macos/Push.app
          spctl --assess --type execute -vv src-tauri/target/release/bundle/macos/Push.app

      - name: Make the dmg
        run: |
          mkdir dmg
          ditto src-tauri/target/release/bundle/macos/Push.app dmg/Push.app
          ln -s /Applications dmg/Applications
          name="${GITHUB_REF_NAME#v}"
          hdiutil create -volname Push -srcfolder dmg -format UDZO "Push_${name//\//-}_aarch64.dmg"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: push-macos-aarch64
          path: Push_*.dmg
          if-no-files-found: error

      - name: Attach to the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: Push_*.dmg
          fail_on_unmatched_files: true
