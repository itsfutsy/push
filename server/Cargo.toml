[package]
name = "push-server"
version = "1.0.0"
edition = "2024"
publish = false

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
futures-util = { version = "0.3.34", default-features = false }
mime = "0.3.17"
subtle = "2.6.1"
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "net", "fs", "io-util", "signal"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["fs", "set-header", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt"] }

[dev-dependencies]
tokio = { version = "1.54", features = ["sync", "time"] }

[profile.release]
lto = "thin"
strip = true
# No panic = "abort": a panicking handler must not take the whole server down.
